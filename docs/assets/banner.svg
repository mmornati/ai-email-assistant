<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">AI Mail Assistant</title>
  <desc id="desc">Rules first, models last: low-cost Gmail triage that turns requests into Google Tasks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#151a3a"/>
      <stop offset="1" stop-color="#1d1340"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- Envelope mark -->
  <g transform="translate(88 92)">
    <rect width="136" height="100" rx="18" fill="none" stroke="url(#accent)" stroke-width="8"/>
    <path d="M14 18 L68 60 L122 18" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="132" cy="2" r="22" fill="#0b1020"/>
    <path d="M132 -14 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" fill="#5eead4"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="272" y="138" font-size="60" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">AI Mail Assistant</text>
    <text x="274" y="182" font-size="24" fill="#cbd5e1">Rules first, models last. Gmail triage that turns requests into Google Tasks.</text>

    <!-- Pipeline chips -->
    <g font-size="17" font-weight="600">
      <g transform="translate(274 220)">
        <rect width="138" height="40" rx="20" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.5"/>
        <text x="69" y="26" text-anchor="middle" fill="#99f6e4">Gmail rules</text>
      </g>
      <text x="426" y="246" font-size="20" fill="#64748b">→</text>
      <g transform="translate(452 220)">
        <rect width="150" height="40" rx="20" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.5"/>
        <text x="75" y="26" text-anchor="middle" fill="#99f6e4">Same-day cache</text>
      </g>
      <text x="616" y="246" font-size="20" fill="#64748b">→</text>
      <g transform="translate(642 220)">
        <rect width="132" height="40" rx="20" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="66" y="26" text-anchor="middle" fill="#ddd6fe">Small model</text>
      </g>
      <text x="788" y="246" font-size="20" fill="#64748b">→</text>
      <g transform="translate(814 220)">
        <rect width="196" height="40" rx="20" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
        <text x="98" y="26" text-anchor="middle" fill="#ddd6fe">Escalate if unsure</text>
      </g>
      <text x="1024" y="246" font-size="20" fill="#64748b">→</text>
      <g transform="translate(1050 220)">
        <rect width="150" height="40" rx="20" fill="#f8fafc" fill-opacity="0.08" stroke="#f8fafc" stroke-opacity="0.35"/>
        <text x="75" y="26" text-anchor="middle" fill="#f1f5f9">Labels + Tasks</text>
      </g>
    </g>
  </g>
</svg>
