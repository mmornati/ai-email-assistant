name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real email content, Gmail IDs, OAuth tokens or files from `state/`.**
        Reproduce with synthetic data. Security problems go through
        [private vulnerability reporting](https://github.com/mmornati/ai-email-assistant/security/advisories/new), not issues.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The command you ran and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `make doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
  - type: input
    id: macos
    attributes:
      label: macOS and Python versions
